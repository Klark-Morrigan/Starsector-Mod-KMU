// KMU's layering rules: which of its package roots may not import which.
//
// Its own file because these are a description of the mod's architecture rather
// than of its build. There are more lines of them than of everything else put
// together, and a reader opening build.gradle to find out how the mod is
// assembled should not have to scroll past the whole shape of the code first.
// The mechanism they are declared through stays in Common-Java's
// gradle/tasks/lint/structure/enforce-package-layering.gradle; this is only the
// edges, which are a per-project fact.
//
// Applied AFTER the shared conventions, since those are what register the task
// this configures. Applied before them, the name resolves to nothing and the
// build fails at configuration time.

// Every package tree beside kmu.mods, closed below against the optional mods'
// own types. Stated as an enumeration because the gate has no exemption clause:
// a single 'under: kmu' edge would shut kmu.mods off from the very mods its
// adapters exist to adapt. A new top-level tree has to be added here to be
// covered - the list is the rule.
def treesClosedToOptionalMods = ['kmu.conditions', 'kmu.desktop', 'kmu.diagnostics',
    'kmu.maplayers', 'kmu.promo', 'kmu.settings', 'kmu.starsector', 'kmu.svg', 'kmu.util']

// The mods KMU may run without, named only by the adapters under kmu.mods. Why,
// and why LazyLib and LunaLib are not among them, is src/main/java/kmu/mods/README.md.
def optionalModPackages = ['assortment_of_things', 'exerelin', 'org.lazywizard.console']

enforcePackageLayering {

    // Optional-mod bans:

    treesClosedToOptionalMods.each { closedTree ->
        forbidImport under: closedTree, of: optionalModPackages
    }

    // The mod plugin in the root package registers the adapters but may not name a
    // mod's own types. 'exactly' rather than 'under', which would re-close every tree above.
    forbidImport exactly: 'kmu', of: optionalModPackages

    // Group bans:

    // The framework names no layer built on it and no adapter. What the optional mods add to it is
    // handed in by the composition root, the one place that names what is installed.
    forbidImport under: 'kmu.maplayers.base',
                 of: ['kmu.maplayers.ownermap',
                      'kmu.maplayers.politicalmap',
                      'kmu.mods']

    // The two features stand side by side, neither built on the other.
    forbidImport under: 'kmu.conditions',
                 of: 'kmu.maplayers'

    forbidImport under: 'kmu.maplayers',
                 of: 'kmu.conditions'

    // The shared substrate every feature reads, so it may name none of them.
    ['kmu.settings', 'kmu.util'].each { substrate ->
        forbidImport under: substrate,
                     of: ['kmu.conditions',
                          'kmu.maplayers']
    }

    // The desktop toolkit is generic Swing furniture, which the geometry viewer builds on.
    forbidImport under: 'kmu.desktop',
                 of: 'kmu.maplayers'

    forbidImport under: 'kmu.maplayers.base.faces',
                 of: ['kmu.maplayers.base.labels',
                      'kmu.maplayers.base.sidebar',
                      'kmu.maplayers.base.tooltip']

    forbidImport under: 'kmu.maplayers.ownermap',
                 of: ['kmu.maplayers.politicalmap',
                      'kmu.mods']

    // Nothing in ownermap may import owners.holders - except owners.holders itself.
    // The rest of ownermap paints any kind of owner, so it must not depend on one kind.
    forbidImport under: 'kmu.maplayers.ownermap',
                 except: 'kmu.maplayers.ownermap.owners.holders',
                 of: 'kmu.maplayers.ownermap.owners.holders'

    forbidImport under: 'kmu.maplayers.ownermap.owners.holders.base',
                 of: ['kmu.maplayers.ownermap.owners.holders.alliances',
                      'kmu.maplayers.ownermap.owners.holders.factions']

    forbidImport under: 'kmu.maplayers.ownermap.owners.holders.factions',
                 of: 'kmu.maplayers.ownermap.owners.holders.alliances'

    forbidImport under: 'kmu.maplayers.base.geometry.output',
                 of: 'kmu.maplayers.base.geometry.ui'

    forbidImport under: 'kmu.maplayers.base.geometry.render',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.settings',
                      'kmu.maplayers.base.geometry.ui',
                      'kmu.maplayers.base.geometry.v3.ui',
                      'kmu.maplayers.base.geometry.v4.ui']

    // The viewer's settings take their defaults from v3's own rules and resolve the rule values v3
    // is run under, so v3 itself stays open to them; only the overlays it is drawn with are closed.
    forbidImport under: 'kmu.maplayers.base.geometry.settings',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.ui',
                      'kmu.maplayers.base.geometry.v3.ui',
                      'kmu.maplayers.base.geometry.v4.ui']

    forbidImport under: 'kmu.maplayers.base.geometry.v4',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.ui',
                      'kmu.maplayers.base.geometry.v3',
                      'kmu.maplayers.base.geometry.walls']

    forbidImport under: 'kmu.maplayers.base.geometry.walls',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.render',
                      'kmu.maplayers.base.geometry.settings',
                      'kmu.maplayers.base.geometry.ui',
                      'kmu.maplayers.base.geometry.v3',
                      'kmu.maplayers.base.geometry.v4']

    forbidImport under: 'kmu.maplayers.base.geometry.v3',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.ui',
                      'kmu.maplayers.base.geometry.v4']

    forbidImport under: 'kmu.maplayers.base.tooltip.content',
                 of: ['kmu.maplayers.base.tooltip.layout',
                      'kmu.maplayers.base.tooltip.detail']

    forbidImport under: 'kmu.maplayers.base.tooltip.detail',
                 of: ['kmu.maplayers.base.tooltip.content',
                      'kmu.maplayers.base.tooltip.layout']

    // The refresh machinery drives the colony sightings poll and reads what is drawn, so the
    // registers it reads may not reach back into it.
    forbidImport under: 'kmu.maplayers.base.visibility',
                 of: 'kmu.maplayers.base.refresh'

    forbidImport under: 'kmu.maplayers.base.visibility.colonies',
                 of: 'kmu.maplayers.base.visibility.systems'

    forbidImport under: 'kmu.maplayers.base.visibility.observations',
                 of: ['kmu.maplayers.base.visibility.colonies',
                      'kmu.maplayers.base.visibility.installations',
                      'kmu.maplayers.base.visibility.structures',
                      'kmu.maplayers.base.visibility.systems']

    // The contest weighs colonies through weighting, so weighting may not reach back into it.
    forbidImport under: 'kmu.maplayers.politicalmap.dominance.weighting',
                 of: [under: 'kmu.maplayers.politicalmap.dominance',
                      except: 'kmu.maplayers.politicalmap.dominance.weighting']

    forbidImport under: 'kmu.svg',
                 of: 'kmu.maplayers'

    // Exact bans:

    // The geometry root is what every generation of the void prototype builds on, so it names none
    // of them nor anything drawn from them.
    forbidImport exactly: 'kmu.maplayers.base.geometry',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.render',
                      'kmu.maplayers.base.geometry.settings',
                      'kmu.maplayers.base.geometry.ui',
                      'kmu.maplayers.base.geometry.v3',
                      'kmu.maplayers.base.geometry.v4',
                      'kmu.maplayers.base.geometry.walls']

    forbidImport exactly: 'kmu.maplayers.base.geometry.ui.settings',
                 of: 'kmu.maplayers.base.geometry.ui'

    forbidImport exactly: 'kmu.maplayers.base.geometry.v3',
                 of: ['kmu.maplayers.base.geometry.render',
                      'kmu.maplayers.base.geometry.settings',
                      'kmu.maplayers.base.geometry.v3.ui']

    forbidImport exactly: 'kmu.maplayers.base.geometry.v4',
                 of: ['kmu.maplayers.base.geometry.render',
                      'kmu.maplayers.base.geometry.settings',
                      'kmu.maplayers.base.geometry.v4.ui']

    forbidImport exactly: 'kmu.maplayers.base.tooltip',
                 of: ['kmu.maplayers.base.tooltip.layout',
                      'kmu.maplayers.base.tooltip.content']
}
