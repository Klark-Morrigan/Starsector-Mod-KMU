// KMU's layering rules: which of its package roots may not import which.
//
// Its own file because these are a description of the mod's architecture rather
// than of its build. They outgrew the build file - there are more lines of them
// than of everything else put together - and a reader opening build.gradle to
// find out how the mod is assembled had to scroll past the whole shape of the
// code first. The mechanism they are declared through stays in Common-Java's
// gradle/tasks/lint/structure/enforce-package-layering.gradle; this is only the
// edges, which are a per-project fact.
//
// Applied AFTER the shared conventions, since those are what register the task
// this configures. Applied before them, the name resolves to nothing and the
// build fails at configuration time.
enforcePackageLayering {

    // Group bans:

    forbidImport under: 'kmu.maplayers.base',
                 of: 'kmu.maplayers.politicalmap'

    forbidImport under: 'kmu.maplayers.base.geometry.output',
                 of: 'kmu.maplayers.base.geometry.ui'

    forbidImport under: 'kmu.maplayers.base.geometry.render',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.settings',
                      'kmu.maplayers.base.geometry.ui']

    forbidImport under: 'kmu.maplayers.base.geometry.settings',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.ui']

    forbidImport under: 'kmu.maplayers.base.tooltip.content',
                 of: ['kmu.maplayers.base.tooltip.layout',
                      'kmu.maplayers.base.tooltip.detail']

    forbidImport under: 'kmu.maplayers.base.tooltip.detail',
                 of: ['kmu.maplayers.base.tooltip.content',
                      'kmu.maplayers.base.tooltip.layout']

    forbidImport under: 'kmu.maplayers.base.visibility.colonies',
                 of: 'kmu.maplayers.base.visibility.systems'

    forbidImport under: 'kmu.maplayers.base.visibility.observations',
                 of: ['kmu.maplayers.base.visibility.colonies',
                      'kmu.maplayers.base.visibility.systems']

    forbidImport under: 'kmu.svg',
                 of: 'kmu.maplayers'

    forbidImport under: 'kmu.ui',
                 of: 'kmu.maplayers'

    // Exact bans:

    forbidImport exactly: 'kmu.maplayers.base.geometry',
                 of: ['kmu.maplayers.base.geometry.output',
                      'kmu.maplayers.base.geometry.render',
                      'kmu.maplayers.base.geometry.settings',
                      'kmu.maplayers.base.geometry.ui']

    forbidImport exactly: 'kmu.maplayers.base.geometry.ui.settings',
                 of: 'kmu.maplayers.base.geometry.ui'

    forbidImport exactly: 'kmu.maplayers.base.hover',
                 of: 'kmu.maplayers.base.installation'

    forbidImport exactly: 'kmu.maplayers.base.refresh',
                 of: 'kmu.maplayers.base.installation'

    forbidImport exactly: 'kmu.maplayers.base.tooltip',
                 of: ['kmu.maplayers.base.tooltip.layout',
                      'kmu.maplayers.base.tooltip.content']
}
