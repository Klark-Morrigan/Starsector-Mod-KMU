# CI for this repo's YAML surfaces, through Common-Automation's reusable
# ci-yaml workflow; its header names the checks it runs.
#
# PR-only: the release path re-runs this same gate through KMLib's
# reusable mod-release workflow, which calls Common-Automation's
# ci-yaml directly rather than routing back through this caller.
name: Common-Automation

on:
  pull_request:
  workflow_dispatch:

jobs:
  ci-yaml:
    uses: Klark-Morrigan/Common-Automation/.github/workflows/ci-yaml.yml@master
