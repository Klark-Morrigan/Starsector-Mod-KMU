# Compiles production code and runs tests.
#
# Triggered by:
#   - pull requests;
#   - workflow_call from release.yml.
#
# Runs on the self-hosted kmu-runner VM. STARSECTOR_HOME must be set on
# the VM. See docs/dev/release.md for runner setup.
name: CI

on:
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    runs-on: [self-hosted, kmu-runner]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install bats-core
        run: sudo apt-get install -y bats

      - name: Run shell script tests
        run: bats .github/tests/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # STARSECTOR_HOME is set on the runner VM. build.gradle resolves
      # starfarer.api.jar and lw_Console.jar from that path automatically.
      - name: Build and test
        run: ./gradlew test jar
