// KMU's build. The shared Starsector mod conventions live in KMLib's
// gradle/starsector-mod.gradle (java target, test stack, coverage, the
// Starsector API classpath, mod_info.json versioning, jar output) and are
// applied below; this file keeps only what is specific to KMU - its group
// and the extra dependencies it pulls beyond the API.
apply from: "${rootDir}/../Starsector-Mod-KMLib/gradle/starsector-mod.gradle"

group = 'kmu'

// The shared conventions expose the resolved install root so KMU can locate
// its own extra dependencies without re-deriving the path.
def starsectorRoot = project.ext.starsectorRoot
def consoleCommandsJars = fileTree(dir: "${starsectorRoot}/mods", include: ['**/jars/lw_Console.jar'])
// KMLib hosts shared helpers (palette, localisation lookups). Resolved via
// the install root because the mod always lives at <starsector>/mods/KMLib,
// the directory layout the launcher expects.
def kmlibJarFile = file("${starsectorRoot}/mods/KMLib/jars/KMLib.jar")
// LazyLib is a hard dependency in mod_info.json (its LazyFont/DrawableString draw
// the political-map faction names - there is no vanilla font API). The mod
// classloader supplies the jar at runtime, so compiling against it is enough.
// Resolved via the install root because LazyLib always lives at
// <starsector>/mods/lw_lazylib, the launcher's expected layout.
def lazyLibJarFile = file("${starsectorRoot}/mods/lw_lazylib/jars/LazyLib.jar")
// Random Assortment of Things is an optional runtime dependency. KMU compiles
// against its Abyssal Fracture type so the access rule can treat the fracture
// as a means of arrival; the mod classloader supplies the jar at runtime when
// RAT is installed, and RandomAssortmentOfThingsMatcher gates every use behind
// a mod-enabled check so a RAT-free install never resolves the type.
def ratJars = fileTree(dir: "${starsectorRoot}/mods", include: ['**/jars/RandomAssortmentofThings.jar'])
// Nexerelin is an optional runtime dependency. KMU compiles against its
// InvasionListener so the political map can repaint a colony that changes hands
// in a Nex war; the mod classloader supplies the jar at runtime when Nex is
// installed, and NexerelinInvasionListenerInstaller gates the listener behind a
// mod-enabled check so a Nex-free install never resolves the type.
def nexJars = fileTree(dir: "${starsectorRoot}/mods", include: ['**/jars/ExerelinCore.jar'])
// XStream backs Starsector's save serialisation. KMU compiles against it to
// override configureXStream and alias the political-map terrain plugin's former
// class name, so saves written before the rename still resolve. It ships inside
// starsector-core (always present with the game), so the game classloader
// supplies it at runtime - compileOnly. Globbed so a version bump does not break
// the path.
def xstreamJars = fileTree(dir: "${starsectorRoot}/starsector-core", include: ['xstream-*.jar'])

dependencies {
    compileOnly consoleCommandsJars
    compileOnly ratJars
    compileOnly nexJars
    compileOnly xstreamJars
    // KMLib is a hard dependency in mod_info.json; Starsector's mod
    // classloader provides the jar at runtime so compileOnly is enough.
    // KMU drives its logging through KMLib's KmLogging, so the LunaLib
    // coupling lives in KMLib's classpath, not here - KMU keeps only its
    // runtime LunaLib dependency declared in mod_info.json.
    compileOnly files(kmlibJarFile)
    compileOnly files(lazyLibJarFile)

    testCompileOnly consoleCommandsJars
    testCompileOnly ratJars
    testCompileOnly nexJars
    testCompileOnly xstreamJars
    testCompileOnly files(kmlibJarFile)
    testCompileOnly files(lazyLibJarFile)
    testRuntimeOnly consoleCommandsJars
    testRuntimeOnly ratJars
    testRuntimeOnly nexJars
    testRuntimeOnly files(kmlibJarFile)
    testRuntimeOnly files(lazyLibJarFile)
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        if (consoleCommandsJars.files.isEmpty()) {
            throw new GradleException(
                    "Could not find Console Commands jar under " +
                    "${starsectorRoot}/mods/**/jars/lw_Console.jar. " +
                    "Install Console Commands for compiling KMU console command integration.")
        }
        if (!kmlibJarFile.exists()) {
            throw new GradleException(
                    "Could not find KMLib jar at ${kmlibJarFile}. " +
                    "Build KMLib first (run `./gradlew jar` in mods/KMLib) " +
                    "or install it under mods/KMLib/jars/KMLib.jar.")
        }
        // LazyLib is a hard dependency at runtime, but its LazyFont is needed to
        // compile the political-map faction-name renderer, so the jar must be
        // present to build.
        if (!lazyLibJarFile.exists()) {
            throw new GradleException(
                    "Could not find LazyLib jar at ${lazyLibJarFile}. " +
                    "Install LazyLib under mods/lw_lazylib/jars/LazyLib.jar " +
                    "for compiling KMU's political-map faction labels.")
        }
        // RAT is optional at runtime but its Abyssal Fracture type is needed to
        // compile RandomAssortmentOfThingsMatcher, so the jar must be present
        // to build even though a player can run KMU without RAT installed.
        if (ratJars.files.isEmpty()) {
            throw new GradleException(
                    "Could not find Random Assortment of Things jar under " +
                    "${starsectorRoot}/mods/**/jars/RandomAssortmentofThings.jar. " +
                    "Install RAT for compiling KMU's Abyssal Fracture access integration.")
        }
        // Nex is optional at runtime but its InvasionListener is needed to
        // compile PoliticalMapMarketTransferListener, so the jar must be present
        // to build even though a player can run KMU without Nex installed.
        if (nexJars.files.isEmpty()) {
            throw new GradleException(
                    "Could not find Nexerelin jar under " +
                    "${starsectorRoot}/mods/**/jars/ExerelinCore.jar. " +
                    "Install Nexerelin for compiling KMU's market-transfer map integration.")
        }
    }
}
