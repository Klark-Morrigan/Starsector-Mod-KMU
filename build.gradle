plugins {
    id 'java'
    id 'jacoco'
}

import groovy.json.JsonSlurper

def modInfoFile = file('mod_info.json')
def modInfo = new JsonSlurper().parse(modInfoFile)

if (!modInfo.version) {
    throw new GradleException("Missing version in ${modInfoFile}")
}

group = 'kmu'
version = modInfo.version

def configuredStarsectorRoot = findProperty('starsectorRoot') ?:
        System.getenv('STARSECTOR_HOME') ?:
        new File(projectDir, '../..').canonicalPath

def apiJarFile = file("${configuredStarsectorRoot}/starsector-core/starfarer.api.jar")
def starsectorCoreJars = fileTree(dir: "${configuredStarsectorRoot}/starsector-core", include: ['*.jar'])
def consoleCommandsJars = fileTree(dir: "${configuredStarsectorRoot}/mods", include: ['**/jars/lw_Console.jar'])

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files(apiJarFile)
    compileOnly consoleCommandsJars

    testImplementation platform('org.junit:junit-bom:5.13.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly files(apiJarFile)
    testCompileOnly consoleCommandsJars
    testRuntimeOnly files(apiJarFile)
    testRuntimeOnly consoleCommandsJars
    testRuntimeOnly starsectorCoreJars
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17

    doFirst {
        if (!apiJarFile.exists()) {
            throw new GradleException(
                    "Could not find starfarer.api.jar at ${apiJarFile}. " +
                    "Set STARSECTOR_HOME or pass -PstarsectorRoot=<path>.")
        }
        if (consoleCommandsJars.files.isEmpty()) {
            throw new GradleException(
                    "Could not find Console Commands jar under " +
                    "${configuredStarsectorRoot}/mods/**/jars/lw_Console.jar. " +
                    "Install Console Commands for compiling KMU console command integration.")
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test

    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests and generates JaCoCo coverage reports.'
    dependsOn test, jacocoTestReport
}

jar {
    archiveFileName = "${project.name}.jar"
    destinationDirectory = file("$projectDir/jars")
}
